# Runs on every push and pull request, same as Travis / AppVeyor would.
# There is no compile step (pure Python); "build" is install-check + tests.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit and end-to-end tests
        run: python -m unittest

      - name: Smoke-test the executable on the sample file
        run: ./name-sorter ./unsorted-names-list.txt

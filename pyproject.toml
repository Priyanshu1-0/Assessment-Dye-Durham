[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "name-sorter"
version = "1.0.0"
description = "Sorts a list of names by last name, then by given names."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
name-sorter = "name_sorter.cli:main"

[tool.setuptools]
packages = ["name_sorter"]
